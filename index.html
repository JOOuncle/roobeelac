<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>루비락 플로팅 배너 시안</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="hero">
      <p class="eyebrow">FLOATING BANNER DEMO</p>
      <h1>스크롤하면<br />플로팅 배너가 가로로 열립니다.</h1>
      <p class="hero-copy">아래로 스크롤해 두 가지 배너가 펼쳐지는 동작을 확인하세요.</p>
      <span class="scroll-hint">SCROLL ↓</span>
    </section>

    <section class="content-section">
      <div class="content-card">
        <span>01</span>
        <h2>기존 제품 찾기</h2>
        <p>기존 루비락 골든그램 사용자를 위한 빠른 이동 배너 예시입니다.</p>
      </div>
      <div class="content-card">
        <span>02</span>
        <h2>리뉴얼 제품 찾기</h2>
        <p>리뉴얼 루비락 네오그랑 사용자를 위한 빠른 이동 배너 예시입니다.</p>
      </div>
    </section>

    <section class="spacer" aria-hidden="true"></section>
  </main>

  <aside class="floating-banner-group" aria-label="루비락 제품 바로가기">
    <a class="floating-banner floating-banner--legacy" href="#golden-gram" aria-label="기존 루비락 골든그램 찾기">
      <span class="floating-banner__thumb">
        <img src="assets/golden-gram.png" alt="" />
      </span>
      <span class="floating-banner__copy">
        <span class="floating-banner__tag">기존</span>
        <strong>루비락 골든그램을 찾으세요?</strong>
        <span class="floating-banner__arrow" aria-hidden="true">→</span>
      </span>
    </a>

    <a class="floating-banner floating-banner--renewal" href="#neo-grang" aria-label="리뉴얼 루비락 네오그랑 찾기">
      <span class="floating-banner__thumb">
        <img src="assets/neo-grang.png" alt="" />
      </span>
      <span class="floating-banner__copy">
        <span class="floating-banner__tag">리뉴얼</span>
        <strong>루비락 네오그랑을 찾으세요?</strong>
        <span class="floating-banner__arrow" aria-hidden="true">→</span>
      </span>
    </a>
  </aside>

  <script src="script.js"></script>
</body>
</html>
